<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <!-- The program's icon: the logo's half gear and its first column of letters, M over W, on a dark tile.
       From the logo in web/index.html (its gear and the M and W polylines), cropped square. build.py renders it
       to web/vendor/workshop.ico; the letters' stroke is set per size there (thicker at 16 to 32). -->
  <rect x="2" y="2" width="124" height="124" rx="24" fill="#1d1914" stroke="#8a6a35" stroke-width="3"/>
  <g transform="translate(-23.57 6.58) scale(0.957)">
    <path fill="#d2a85a" d="M88,17 L83.5,17.2 L80.0,6.6 L68.2,9.8 L70.5,20.7 L62.7,25.2 L54.4,17.8 L45.8,26.4 L53.2,34.7 L48.7,42.5 L37.8,40.2 L34.6,52.0 L45.2,55.5 L45.2,64.5 L34.6,68.0 L37.8,79.8 L48.7,77.5 L53.2,85.3 L45.8,93.6 L54.4,102.2 L62.7,94.8 L70.5,99.3 L68.2,110.2 L80.0,113.4 L83.5,102.8 L88,103 Z"/>
    <path fill="#1d1914" d="M88,34 A26,26 0 0 0 88,86 Z"/>
    <path fill="#d2a85a" d="M88,48 A12,12 0 0 0 88,72 Z"/>
    <circle fill="#1d1914" cx="80" cy="60" r="4"/>
    <!-- (the letters 9 nearer the gear than in the logo, the user's choice) -->
    <g transform="translate(-9 0)">
    <polyline class="ltr" fill="none" stroke="#d2a85a" stroke-width="10.5" stroke-linejoin="bevel" stroke-linecap="butt" points="105.2,58.0 105.2,13.2 129.0,37.0 152.8,13.2 152.8,58.0"/>
    <polyline class="ltr" fill="none" stroke="#f0cd87" stroke-width="10.5" stroke-linejoin="bevel" stroke-linecap="butt" points="105.2,62.0 105.2,106.8 129.0,83.0 152.8,106.8 152.8,62.0"/>
    </g>
  </g>
</svg>
